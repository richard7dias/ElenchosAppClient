<div>
    <h4>Fonte de Gastos</h4>
</div>


<table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

    <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by description">
            Descrição
        </th>
        <td mat-cell *matCellDef="let element"> {{element.description}} </td>
        <td mat-footer-cell class="tfoot" *matFooterCellDef> Total </td>
    </ng-container>`

    <ng-container matColumnDef="valueExpense">
        <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by valueExpense">
            Valor
        </th>
        <td mat-cell class="values" *matCellDef="let element">
            <div id="container-values">
                <p class="value-RS">R$</p>
                <p class="value-real">{{ this._numberFormat.inPortToDuo(element.valueExpense)}}</p>
            </div>
        </td>
        <td mat-footer-cell class="values tfoot" *matFooterCellDef>
            <div id="container-values">
                <p class="value-RS">R$</p>
                <p class="value-real">{{getTotalValue()}}</p>
            </div>
        </td>
    </ng-container>

    <ng-container matColumnDef="itens">
        <th mat-header-cell *matHeaderCellDef>
            <button mat-icon-button matTooltip="Adicione uma fonte de gasto" matTooltipPosition="above"
                (click)="openModalNewExpense()">
                <mat-icon>add_box</mat-icon>
            </button>
        </th>
        <td mat-cell *matCellDef="let element">
            <button mat-icon-button [matMenuTriggerFor]="menu"
                *ngIf="element.id != '9b9f704a-938a-4923-8e63-277ba52007ef'">
                <mat-icon>more_vert</mat-icon>
            </button>

            <mat-menu #menu="matMenu">
                <button mat-menu-item (click)="openModalEditExpense(element)">
                    <mat-icon>edit</mat-icon>
                    <span>Editar</span>
                </button>
                <button mat-menu-item (click)="openModalDeleteExpense(element)">
                    <mat-icon color="warn">delete</mat-icon>
                    <span>Apagar</span>
                </button>
            </mat-menu>

        </td>
        <td mat-footer-cell class="tfoot" *matFooterCellDef></td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true;"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    <tr mat-footer-row *matFooterRowDef="displayedColumns; sticky: true;"></tr>

    <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="4">
            Adicione uma nova fonte de gastos no "+" acima.
        </td>
    </tr>
</table>
