<main>
    <h2 mat-dialog-title>Nova fonte de gastos</h2>
    <form (submit)="submitForm()">
        <mat-dialog-content>

            <mat-form-field>
                <mat-label>Descrição da fonte de gastos:</mat-label>
                <input matInput type="text" [(ngModel)]="expenseDescriptionInput" name="expenseDescriptionInput"
                    placeholder="Ex: Cartão de crédito" required cdkFocusInitial>
            </mat-form-field>

            <mat-form-field>
                <mat-label>Valor atual:</mat-label>
                <input matInput type="number" [(ngModel)]="expenseValueInput" name="expenseValueInput" required>
            </mat-form-field>

        </mat-dialog-content>
        <mat-dialog-actions align="end">
            <button mat-button mat-dialog-close>Cancelar</button>
            <button mat-button type="submit">Adicionar</button>
        </mat-dialog-actions>

    </form>
</main>
