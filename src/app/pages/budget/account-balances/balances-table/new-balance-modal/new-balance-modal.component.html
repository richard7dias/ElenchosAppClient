<main>
  <h2 mat-dialog-title>Nova conta bancária</h2>
  <form (submit)="submitForm()">
    <mat-dialog-content>

      <mat-form-field>
        <mat-label>Nome da conta:</mat-label>
        <input matInput type="text" [(ngModel)]="newAccountName" name="newAccountName" placeholder="Ex. Nubank, Itaú..."
          required cdkFocusInitial>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Saldo da conta:</mat-label>
        <input matInput type="number" [(ngModel)]="newAccountValue" name="newAccountValue" required>
      </mat-form-field>

    </mat-dialog-content>
    <mat-dialog-actions align="end">
      <button mat-button mat-dialog-close>Cancelar</button>
      <button mat-button type="submit">Adicionar</button>
    </mat-dialog-actions>

  </form>
</main>
