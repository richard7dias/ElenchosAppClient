<main>
    <h2 mat-dialog-title>Editar categoria</h2>
    <form (submit)="submitForm()">

        <mat-dialog-content>

            <mat-form-field>
                <mat-label>Nome da categoria:</mat-label>
                <input matInput type="text" [(ngModel)]="categoryNameInput" name="categoryNameInput"
                    placeholder="Ex. Combustível, Mercado..." required>
            </mat-form-field>

            <mat-form-field>
                <mat-label>Orçamento:</mat-label>
                <input matInput type="number" [(ngModel)]="categoryBudgetInput" name="categoryBudgetInput" required
                    cdkFocusInitial>
            </mat-form-field>

        </mat-dialog-content>
        <mat-dialog-actions align="end">
            <button mat-button mat-dialog-close>Cancelar</button>
            <button mat-button type="submit">Editar</button>
        </mat-dialog-actions>

    </form>
</main>
