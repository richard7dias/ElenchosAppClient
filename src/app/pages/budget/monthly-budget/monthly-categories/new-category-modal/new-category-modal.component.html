<main>
    <h2 mat-dialog-title>Nova categoria</h2>
    <form (submit)="submitForm()">
      <mat-dialog-content>
  
        <mat-form-field>
          <mat-label>Nome da categoria mensal:</mat-label>
          <input matInput type="text" [(ngModel)]="newCategoryName" name="newCategoryName" placeholder="Ex. Combustível, Mercado..."
            required cdkFocusInitial>
        </mat-form-field>
  
        <mat-form-field>
          <mat-label>Orçamento:</mat-label>
          <input matInput type="number" [(ngModel)]="newCategoryBudget" name="newCategoryBudget" required>
        </mat-form-field>
  
      </mat-dialog-content>
      <mat-dialog-actions align="end">
        <button mat-button mat-dialog-close>Cancelar</button>
        <button mat-button type="submit">Adicionar</button>
      </mat-dialog-actions>
  
    </form>
  </main>
