<main>
    <h1 mat-dialog-title>Confirmação</h1>
    <div mat-dialog-content>
        <p id="subtitle">
            Você tem certeza que gostaria de apagar o lançamento {{_data.description}} de {{_data.categoryName}}?
        </p>
    </div>

    <div mat-dialog-actions align="end">
        <button mat-button mat-dialog-close>Cancelar</button>
        <button mat-button color="warn" (click)="deleteLaunch()">Sim</button>
    </div>
</main>
