<main>
  <h2 mat-dialog-title>Nova cotação</h2>
  <form (submit)="submitForm()">
    <mat-dialog-content>
      <mat-form-field>
        <mat-label>Converter de:</mat-label>
        <input matInput type="text" [(ngModel)]="quoteFrom" name="quoteFrom" placeholder="Ex. Dólar, Real, Euro..."
          required cdkFocusInitial>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Para a moeda:</mat-label>
        <input matInput type="text" [(ngModel)]="quoteFor" name="quoteFor" placeholder="Ex. Dólar, Real, Euro..."
          required>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Valor de 1 {{quoteFrom}} em {{quoteFor}}:</mat-label>
        <input matInput type="number" [(ngModel)]="quotationValue" name="quotationValue" required>
      </mat-form-field>

      {{check}}

    </mat-dialog-content>
    <mat-dialog-actions align="end">
      <button mat-button mat-dialog-close>Cancelar</button>
      <button mat-button type="submit">Adicionar</button>
    </mat-dialog-actions>

  </form>
</main>
