<h1 mat-dialog-title>Confirmação</h1>
<div mat-dialog-content id="mat-dialog-content">
    <p id="subtitle">Você tem certeza que gostaria de apagar sua conta?</p>

    <mat-form-field *ngIf="seePasswordField">
        <mat-label>Confirme com sua senha</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" name="password" [(ngModel)]="password" required>
        <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" [attr.aria-label]="'Hide password'"
            [attr.aria-pressed]="hidePassword">
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
    </mat-form-field>

</div>
<div mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancelar</button>
    <button mat-button color="warn" (click)="seePasswordField = !seePasswordField"
        *ngIf="!seePasswordField">Sim</button>
    <button mat-button color="warn" mat-dialog-close (click)="deleteUser()" *ngIf="seePasswordField">Deletar</button>
</div>
